spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    openai:
      base-url: ${TSUMI_AI_BASE_URL}
      api-key: ${TSUMI_AI_API_KEY}
      chat:
        options:
          model: ${TSUMI_AI_MODEL}

tsumi:
  ai:
    node-timeout: ${TSUMI_AI_NODE_TIMEOUT:90s}
    max-output-tokens: 2000
    analyst-model: ${TSUMI_AI_ANALYST_MODEL:${TSUMI_AI_MODEL}}
    rewrite-model: ${TSUMI_AI_REWRITE_MODEL:${TSUMI_AI_MODEL}}
    guard-model: ${TSUMI_AI_GUARD_MODEL:${TSUMI_AI_MODEL}}
