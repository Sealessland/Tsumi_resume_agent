spring:
  config:
    import: optional:file:./config/ai-secrets.properties
  datasource:
    url: jdbc:h2:file:./.data/tsumi-resume-ai;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    hikari:
      maximum-pool-size: 4
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    openai:
      base-url: ${TSUMI_AI_BASE_URL:${tsumi.ai.base-url}}
      api-key: ${TSUMI_AI_API_KEY:${tsumi.ai.api-key}}
      chat:
        options:
          model: ${TSUMI_AI_MODEL:${tsumi.ai.model}}

tsumi:
  ai:
    node-timeout: ${TSUMI_AI_NODE_TIMEOUT:90s}
    max-output-tokens: 2000
    analyst-model: ${TSUMI_AI_ANALYST_MODEL:${TSUMI_AI_MODEL:${tsumi.ai.model}}}
    rewrite-model: ${TSUMI_AI_REWRITE_MODEL:${TSUMI_AI_MODEL:${tsumi.ai.model}}}
    guard-model: ${TSUMI_AI_GUARD_MODEL:${TSUMI_AI_MODEL:${tsumi.ai.model}}}
